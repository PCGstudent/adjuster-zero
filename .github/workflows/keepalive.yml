name: Keep-alive

# Supabase Free pauses a project after ~7 days of inactivity, and Cloud Run
# scales to zero. A daily trivial query + a health ping keeps the demo warm so a
# recruiter clicking the link never meets a sleeping database.

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (PostgREST, trivial read)
        if: ${{ secrets.SUPABASE_URL != '' }}
        run: |
          curl -fsS \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/claims?select=id&limit=1" \
            && echo "supabase ok" || echo "supabase ping failed (non-fatal)"
      - name: Ping Cloud Run agent /healthz
        if: ${{ secrets.AGENT_URL != '' }}
        run: |
          curl -fsS "${{ secrets.AGENT_URL }}/healthz" \
            && echo "agent ok" || echo "agent ping failed (non-fatal)"
